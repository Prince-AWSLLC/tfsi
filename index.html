<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Texans for a Safe Israel is a 501(c)(3) that supports the Jewish people in Israel — especially Jerusalem, Judea, and Samaria — and builds friendships in Texas."
    />
    <title>Texans for a Safe Israel</title>
    <style>
      html,
      body {
        margin: 0;
        background: #002868;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #002868;
        transition: opacity 0.48s ease;
      }
      #boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot img {
        height: 76px;
        width: auto;
        max-width: 80vw;
        mix-blend-mode: screen;
      }
      #boot .boot-rule {
        width: 80px;
        height: 2px;
        margin-top: 20px;
        background: #c8102e;
        transform-origin: left center;
        animation: boot-rule 1s ease forwards;
      }
      @keyframes boot-rule {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-rule {
          animation: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <img src="/images/logo.png" alt="" />
      <div class="boot-rule"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
