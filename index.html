<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D233A" />
    <meta
      name="description"
      content="Texans for a Safe Israel is a 501(c)(3) that supports the Jewish people in Israel — especially Jerusalem, Judea, and Samaria — and builds friendships in Texas."
    />
    <meta property="og:title" content="Texans for a Safe Israel" />
    <meta
      property="og:description"
      content="A Granbury, Texas 501(c)(3) standing with the Jewish people in Jerusalem, Judea, and Samaria."
    />
    <meta property="og:image" content="/images/lodge-exterior.jpg" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <title>Texans for a Safe Israel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="fetch" href="/siteData.json" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/images/lodge-exterior.jpg" fetchpriority="high" />

    <style>
      html,
      body {
        margin: 0;
        background: #0d233a;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0d233a;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot img {
        height: 72px;
        width: auto;
        max-width: 72vw;
      }
      #boot .boot-rule {
        width: 72px;
        height: 2px;
        background: #7a1428;
        transform-origin: left center;
        animation: boot-rule 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes boot-rule {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          transition: none;
        }
        #boot .boot-rule {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <img src="/images/logo-mark.png" alt="" width="97" height="72" />
      <div class="boot-rule"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
